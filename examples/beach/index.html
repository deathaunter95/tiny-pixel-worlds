<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Framekind: sandcastle beach (pixel method)</title>
<style>
  html, body { margin: 0; background: #1d2330; }
  canvas { display: block; image-rendering: pixelated; width: 432px; height: 768px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>window.PP_SCENE = { W: 216, H: 384, S: 16, originY: 26, shadowX: -.07, shadowY: -.32, rot: 1 };</script>
<script src="../../engine/pxengine.js"></script>
<script>
'use strict';
// Framekind tiny world on the pixel-plays method (same engine as the viaduct and the seaplane): a beach with palms. Two kids finish a
// sandcastle; a big wave comes in, they run up the beach, the water washes the castle into a wet lump and knocks the flag down; they come
// back and build it again: pat the keep up out of the lump, bucket towers (fill, flip, pat, lift), the wall, the flag goes back on top.
// 20 s seamless loop: the last frame is the first frame (castle finished, kids patting it).
const LOOP = 20, AL = 20, TAU = Math.PI * 2, HALF = 5.2;
const smooth = (a, b, t) => ease(clamp((t - a) / (b - a), 0, 1));
const sstep = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mod = (a, n) => ((a % n) + n) % n;
const LIT = (() => { const v = [.55, -.3, .78], l = Math.hypot(...v); return v.map(q => q / l); })();
const shadeN = (nx, ny, nz) => { const l = Math.hypot(nx, ny, nz) || 1; return Math.max(0, (nx * LIT[0] + ny * LIT[1] + nz * LIT[2]) / l); };
const edgeOf = (x, y) => Math.pow(Math.pow(Math.abs(x) / HALF, 4) + Math.pow(Math.abs(y) / HALF, 4), .25);
const scr = (su, sv) => [sv, -su];                      // rot 1: screen right = old -v (the sea), screen front = old +u
const toUV = (x, y) => [(x - y) / R2, (x + y) / R2];
const fromUV = (u, v) => [(u + v) / R2, (v - u) / R2];
function pplot(x, y, z, colFn) { const p = project(x, y, z), ix = p.sx | 0, iy = p.sy | 0; if (ix < 0 || iy < 0 || ix >= W || iy >= H) return; const i = iy * W + ix; if (p.d <= zb[i]) return; zb[i] = p.d; pix[i] = colFn(ix, iy); }
const WHITE = [240, 240, 236], FOAM = rgb(244, 250, 248), LIGHT = rgb(190, 234, 232);

/* ---------- beach and sea ---------- */
// the sea is at the back (small v), the beach rises gently toward the camera; d = distance up the beach from the waterline
const vShore = u => -1.8 + .45 * Math.sin(u * .55 + .6) + .3 * (noise(u * .8, 3) - .5);
const dOf = (x, y) => { const [u, v] = toUV(x, y); return v - vShore(u); };
function landH(x, y) {
  const d = dOf(x, y);
  if (d <= 0) return 0;
  return Math.min(1.25, .04 + d * .1) + .03 * (noise(x * 2.2, y * 2.2) - .5) * Math.min(1, d);
}
const SAND = [[206, 186, 140], [220, 202, 156], [232, 216, 172], [242, 230, 194]];
const SEA = [], SANDPX = [];
function terrain() {
  const st = .03;
  for (let x = -HALF; x <= HALF; x += st) for (let y = -HALF; y <= HALF; y += st) {
    if (edgeOf(x, y) > 1) continue;
    const z = landH(x, y), p = project(x, y, z), ix = p.sx | 0, iy = p.sy | 0;
    if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;
    const i = iy * W + ix; if (p.d <= zb[i]) continue;
    zb[i] = p.d; ground[i] = 1;
    const [u] = toUV(x, y), d = dOf(x, y), b = bayerAt(ix, iy);
    if (d <= 0) { pix[i] = rgb(70, 170, 190); kinds[i] = 2; SEA.push(i, Math.round(x * 100), Math.round(y * 100), Math.round(-d * 100)); continue; }
    kinds[i] = 1; SANDPX.push(i, Math.round(u * 100), Math.round(d * 100));
    const nx = landH(x - .05, y) - landH(x + .05, y), ny = landH(x, y - .05) - landH(x, y + .05), l = shadeN(nx, ny, .1);
    const rip = Math.sin((x + y) * 7 + noise(x, y) * 4) > .82 ? -.5 : 0;           // little wind ripples in the dry sand
    let c = SAND[clamp(Math.floor(.9 + l * 2.4 + (noise(x * 3, y * 3) - .5) * .8 + (b - .5) * .6 + (d > 4.5 ? rip : 0)), 0, 3)];
    if (d < .7) c = c.map(q => q * (.8 + .2 * d / .7));                            // the always-damp strip at the waterline
    pix[i] = rgb(...c);
    if (d > 1.2 && hash(ix, iy * 3) < .012) pix[i] = rgb(250, 244, 230);            // shell bits
  }
  const dedupe = (L, n) => { const last = new Map(); for (let k = 0; k < L.length; k += n) last.set(L[k], k); const o = []; for (const k of last.values()) for (let j = 0; j < n; j++) o.push(L[k + j]); L.length = 0; L.push(...o); };
  dedupe(SEA, 4); dedupe(SANDPX, 3);
  // the slab's cut sides: water over wet sand where the sea is, sand strata under the beach
  for (let a = 0; a < TAU; a += .0016) {
    const c = Math.cos(a), s = Math.sin(a), r = HALF / Math.pow(Math.abs(c) ** 4 + Math.abs(s) ** 4, .25) - .02, x = r * c, y = r * s, top = landH(x, y);
    let nx = Math.sign(x) * Math.abs(x) ** 3, ny = Math.sign(y) * Math.abs(y) ** 3; const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
    const l = shadeN(nx, ny, 0), wet = top <= 0;
    for (let z = -2.0; z <= top; z += .035) {
      const g = noise(a * 40, z * 4), p = project(x, y, z), bb = bayerAt(p.sx | 0, p.sy | 0);
      let col;
      if (wet && z > -.8) col = rampOf([60, 150, 176])[clamp(Math.floor(1.2 + l * 1.6 + (z > -.06 ? 1.5 : 0) + (z + .8) * 1.2 + (bb - .5) * .6), 0, 4)];
      else if (top - z < .9) col = rampOf([214, 192, 146])[clamp(Math.floor(.8 + l * 2.2 + (Math.floor(z * 6 + g) % 2 ? .3 : -.2) + (bb - .5) * .5), 0, 4)];
      else col = rampOf(hash(Math.floor(a * 120), Math.floor(z * 5)) > .88 ? [150, 140, 130] : [150, 118, 86])[clamp(Math.floor(.6 + l * 2.2 + (Math.floor(z * 2.4 + g) % 2 ? .3 : -.15) + (g - .5) * .8 + (bb - .5) * .5), 0, 4)];
      plot(x, y, z, col);
    }
  }
}
function rbox(cx, cy, yaw, hl, hw, z0, z1, c, seed = 0) {
  const ramp = rampOf(c), fx = Math.cos(yaw), fy = Math.sin(yaw), sx = -fy, sy = fx, st = .035;
  const W2 = (a, b) => [cx + fx * a + sx * b, cy + fy * a + sy * b];
  const paint = (x, y, z, l, grain) => pplot(x, y, z, (ix, iy) => ramp[clamp(Math.floor(.5 + l * 3.2 + (grain - .5) * .9 + (bayerAt(ix, iy) - .5) * .5), 0, 4)]);
  for (let a = -hl; a <= hl; a += st) for (let b = -hw; b <= hw; b += st) { const [x, y] = W2(a, b); paint(x, y, z1, shadeN(0, 0, 1), noise(a * 1.2 + seed, b * 6)); }
  for (const [na, nb, off, span] of [[1, 0, hl, hw], [-1, 0, hl, hw], [0, 1, hw, hl], [0, -1, hw, hl]]) {
    const nx = fx * na + sx * nb, ny = fy * na + sy * nb; if (nx - ny < -.2) continue;
    for (let w = -span; w <= span; w += st) for (let z = z0; z <= z1; z += st) { const [x, y] = na ? W2(na * off, w) : W2(w, nb * off); paint(x, y, z, shadeN(nx, ny, 0), noise(w * 1.2 + seed, z * 6)); }
  }
}
// a coconut palm: ringed trunk with a gentle curve, a crown of drooping fronds with leaflets, coconuts (seaplane v2)
function palm(u, v, h, lean, seed, t, shadowOnly) {
  const [x, y] = fromUV(u, v), z0 = landH(x, y), segs = 10, dir = hash(seed, 1) * TAU;
  if (shadowOnly) { for (let z = .5; z < h + 1; z += .5) castShadow(x + Math.cos(dir) * lean * (z / h) ** 2, y + Math.sin(dir) * lean * (z / h) ** 2, z0 + z, z > h - .3 ? .85 : .14); return; }
  let p = [x, y, z0];
  for (let k = 1; k <= segs; k++) {
    const f = k / segs, n = [x + Math.cos(dir) * lean * f * f, y + Math.sin(dir) * lean * f * f, z0 + h * f];
    capsule(p, n, .17 - f * .06, .16 - f * .06, () => (k % 2 ? [156, 124, 90] : [128, 100, 74]), 'solid'); p = n;
  }
  const top = p;
  for (let k = 0; k < 4; k++) sphere(top[0] + Math.cos(k * 1.6 + seed) * .14, top[1] + Math.sin(k * 1.6 + seed) * .14, top[2] - .14, .1, [112, 86, 46], 'solid');
  const N = 10;
  for (let fr = 0; fr < N; fr++) {
    const a = fr / N * TAU + seed * .7, sw = .07 * Math.sin(TAU * 4 * t / AL + fr * .9 + seed), len = 1.25 + .3 * hash(fr, seed), up = fr % 2 ? .45 : .25;
    const col = fr % 3 === 0 ? [112, 176, 80] : fr % 3 === 1 ? [84, 152, 66] : [62, 128, 58];
    let q = top;
    for (let k = 1; k <= 7; k++) {
      const f = k / 7, r = len * f, n = [top[0] + Math.cos(a + sw) * r, top[1] + Math.sin(a + sw) * r, top[2] + (.5 + up) * f - (1.0 + up) * f * f];
      capsule(q, n, .08 * (1 - f * .5), .07 * (1 - f * .5), () => col, 'solid');
      if (k > 1) for (const s of [-1, 1]) {
        const ox = -Math.sin(a + sw) * s, oy = Math.cos(a + sw) * s, ll = .3 * (1 - f * .5);
        capsule(n, [n[0] + ox * ll + Math.cos(a) * .1, n[1] + oy * ll + Math.sin(a) * .1, n[2] - ll * .3], .04, .02, () => col, 'solid');
      }
      q = n;
    }
  }
}
function bush(u, v, r, seed) {
  const [x, y] = fromUV(u, v), z0 = landH(x, y);
  for (let k = 0; k < 26; k++) { const a = hash(k, seed) * TAU, d = Math.sqrt(hash(k * 3, seed)) * r, h = hash(k * 7, seed);
    sphere(x + Math.cos(a) * d, y + Math.sin(a) * d, z0 + .1 + h * r * .6, .15 + h * .1, h > .7 ? [130, 176, 80] : h > .35 ? [96, 150, 66] : [66, 116, 58], 'rough'); }
  castShadow(x, y, .4, r);
}
const PALMS = [[-4.4, 1.0, 3.2, .8, 1], [-3.3, 2.8, 2.6, .6, 2], [...scr(-4.3, .8), 3.0, .7, 3]];
const BUSHES = [[-3.9, 2.0, .45, 11], [...scr(-3.6, 2.4), .4, 12], [-2.4, 4.4, .35, 13]];
// beach umbrella, towel and a cool box (static, baked)
const UMB = { u: -2.8, v: 2.4, h: 2.0, r: 1.0 };
function umbrella() {
  const [x, y] = fromUV(UMB.u, UMB.v), z0 = landH(x, y), top = z0 + UMB.h;
  capsule([x, y, z0 - .1], [x + .25, y - .1, top], .045, .04, () => [236, 236, 230], 'solid');
  const cx = x + .25, cy = y - .1;
  for (let r = 0; r <= UMB.r; r += .025) for (let a = 0; a < TAU; a += .03 / Math.max(.15, r)) {
    const sector = Math.floor(mod(a, TAU) / (TAU / 8)), droop = r * .42 + (r / UMB.r) ** 3 * .12, sc = (Math.cos(a * 8) * .5 + .5) * .02;
    const col = sector % 2 ? [244, 240, 228] : [226, 72, 64];
    pplot(cx + Math.cos(a) * r, cy + Math.sin(a) * r, top - droop + sc, (ix, iy) => rampOf(col)[clamp(Math.floor(2.4 + (1 - r / UMB.r) * .9 + Math.cos(a - .9) * .7 + (bayerAt(ix, iy) - .5) * .5), 0, 4)]);
  }
  for (let r = .2; r <= UMB.r; r += .2) for (let a = 0; a < TAU; a += .3) castShadow(cx + Math.cos(a) * r, cy + Math.sin(a) * r, top - .4, .22, 1, .2);
  const [tx, ty] = fromUV(1.9, 3.1), tz = landH(tx, ty);              // the kids' towel, front and centre: where they run to
  for (let a = -.8; a <= .8; a += .025) for (let b = -.4; b <= .4; b += .025) {
    const yaw = -Math.PI / 4, X = tx + Math.cos(yaw) * a - Math.sin(yaw) * b, Y = ty + Math.sin(yaw) * a + Math.cos(yaw) * b, st = Math.floor((a + .8) * 4) % 2;
    pplot(X, Y, tz + .02, (ix, iy) => rampOf(st ? [70, 160, 210] : [250, 214, 80])[clamp(Math.floor(2.6 + (bayerAt(ix, iy) - .5) * .5), 0, 4)]);
  }
  const [bx, by] = fromUV(UMB.u - 1.35, UMB.v - .1), bz = landH(bx, by);
  rbox(bx, by, .4, .32, .22, bz, bz + .34, [70, 150, 210], 2); rbox(bx, by, .4, .34, .24, bz + .34, bz + .4, [240, 240, 236], 3);
  castShadow(bx, by, .3, .4);
}

/* ---------- waves ---------- */
// four waves a loop; wave 1 is the big one that reaches the castle. Each: start time, reach up the beach, run-up and backwash times, how
// long the sand it wet stays dark. Everything is computed from the time since each wave started, mod LOOP, so the loop is seamless.
const CAS = { u: .6, v: 1.0 }, CASTLE_D = CAS.v - vShore(CAS.u);
const WAVES = [{ t: .4, R: 1.1, tin: 1.1, tout: 1.8, dry: 2.6 }, { t: 5.0, R: CASTLE_D + 1.15, tin: 1.7, tout: 2.6, dry: 7.5, big: true },
  { t: 9.8, R: 1.3, tin: 1.1, tout: 1.9, dry: 2.6 }, { t: 14.6, R: .9, tin: 1.0, tout: 1.7, dry: 2.4 }];
const reachOf = (w, k, u) => w.R * (1 + (w.big ? .05 : .12) * Math.sin(u * .6 + k * 1.7));
const frontAt = (w, age, R) => age < w.tin ? R * (1 - (1 - age / w.tin) ** 2) : age < w.tin + w.tout ? R * (1 - sstep((age - w.tin) / w.tout)) : 0;
function swashEdge(u, t) {
  let e = .12 + .06 * Math.sin(TAU * 5 * t / LOOP + u * .8);
  WAVES.forEach((w, k) => { const age = mod(t - w.t, LOOP); e = Math.max(e, frontAt(w, age, reachOf(w, k, u))); });
  return e;
}
function wetAt(u, d, t) {
  let wet = 0;
  WAVES.forEach((w, k) => {
    const age = mod(t - w.t, LOOP), R = reachOf(w, k, u), life = w.tin + w.tout;
    if (age > life + w.dry) return;
    const reached = age < w.tin ? d < frontAt(w, age, R) : d < R;
    if (reached) wet = Math.max(wet, age < life ? 1 : 1 - (age - life) / w.dry);
  });
  return wet;
}
// time the big wave's front reaches a given distance up the beach (for the castle collapse)
function bigHit(d) { const w = WAVES[1], R = reachOf(w, 1, CAS.u); if (d >= R) return 1e9; return w.t + w.tin * (1 - Math.sqrt(1 - d / R)); }
function drawSwash(t) {
  const n = SANDPX.length / 3;
  for (let k = 0; k < n; k++) {
    const i = SANDPX[k * 3]; if (zb[i] !== groundZ[i]) continue;
    const u = SANDPX[k * 3 + 1] / 100, d = SANDPX[k * 3 + 2] / 100;
    if (d > CASTLE_D + 1.6) continue;
    const e = swashEdge(u, t);
    if (d < e) {
      const depth = e - d, c = bakedPix[i], lace = .09 + .07 * hash(i, 3);
      if (depth < lace) { pix[i] = FOAM; continue; }
      const k2 = clamp(.42 + depth * .5, .42, .82), sr = (c & 255) * .75, sg = (c >> 8 & 255) * .75, sb = (c >> 16 & 255) * .75;
      pix[i] = rgb(lerp(sr, 110, k2), lerp(sg, 206, k2), lerp(sb, 210, k2));
      if (hash(i, Math.floor(t * 6)) < .035 + .05 * (depth < .5)) pix[i] = LIGHT;                   // foam lace riding the sheet
      continue;
    }
    const w = wetAt(u, d, t);
    if (w > 0) { const c = bakedPix[i]; pix[i] = rgb((c & 255) * (1 - .2 * w), (c >> 8 & 255) * (1 - .25 * w), (c >> 16 & 255) * (1 - .32 * w)); if (w > .8 && hash(i, 9) < .03) pix[i] = rgb(236, 242, 236); }
  }
}
function drawSea(t) {
  const n = SEA.length / 4, p = t / AL, lp = (fn, K) => (1 - p) * fn(-p * K) + p * fn((1 - p) * K);
  for (let k = 0; k < n; k++) {
    const i = SEA[k * 4], x = SEA[k * 4 + 1] / 100, y = SEA[k * 4 + 2] / 100, d = SEA[k * 4 + 3] / 100;
    if (zb[i] !== groundZ[i]) continue;
    const surf = .62 + .38 * Math.sin(TAU * 5 * t / AL + d * 3.2);
    if (d < .08 + .1 * surf) { pix[i] = FOAM; continue; }
    const deep = clamp(d / 5, 0, 1), sh = lp(o => noise(x * 1.4 + o, y * 2.2), 9.6), gl = lp(o => noise(x * 2.6 + 4, y * 3.4 + o * .7), 12.4);
    const base = [lerp(120, 36, deep), lerp(216, 140, deep), lerp(212, 186, deep)];
    const swell = Math.sin((x + y) * .9 + d * .9 + TAU * 4 * t / AL), kk = (sh > .62 ? 1.1 : sh < .36 ? .9 : 1) * (swell > .82 ? 1.08 : swell < -.85 ? .95 : 1);
    pix[i] = gl > .86 ? rgb(214, 244, 246) : rgb(base[0] * kk, base[1] * kk, base[2] * kk);
    if (d < 2.4) { const c = lp(o => noise(x * 3.2 + o, y * 3.6 - o * .4), 14.4); if (Math.abs(c - .5) < .03 * (1 - d / 2.4) + .008) pix[i] = rgb(196, 246, 238); }
    // each wave rolls in as a breaker line before it runs up the sand (the big one is a fat white wall with a dark face)
    for (const w of WAVES) {
      const lead = mod(w.t - t, LOOP), span = w.big ? 3.0 : 2.0; if (lead > span) continue;
      const db = lead * (w.big ? 2.0 : 1.7), wd = (w.big ? .3 : .13) * (1 - lead / span * .4), off = d - db + .1 * (noise(x * 2, y * 2) - .5);
      if (off > -wd && off < 0) pix[i] = off > -wd * .55 || hash(i, 5) < .5 ? FOAM : LIGHT;
      else if (w.big && off >= 0 && off < .5) pix[i] = rgb(base[0] * .78, base[1] * .82, base[2] * .9);
    }
    if (d > .9 && hash(i, 7) < .045) {
      const tw = Math.sin(TAU * ((4 + Math.floor(hash(i, 11) * 4)) * t / AL + hash(i, 9)));
      if (tw > .9 && lp(o => noise(x * .45 + o, y * .45), 3.6) > .45) pix[i] = tw > .97 ? rgb(255, 255, 250) : rgb(206, 240, 244);
    }
    if (staticShadow[i]) tint(i, .7, .72, .86);

}

/* ---------- the sandcastle ---------- */
// a heightfield over the castle's patch of beach: a keep with battlements, four bucket towers on the diagonals, a low wall between them,
// and the wet lump the wave leaves. Each part has its own height factor and wetness over time.
const [CX, CY] = fromUV(CAS.u, CAS.v), CZ = landH(CX, CY);
const TOWERS = [{ n: 'N', dx: -.6, dy: -.6 }, { n: 'E', dx: .6, dy: -.6 }, { n: 'W', dx: -.6, dy: .6 }, { n: 'S', dx: .6, dy: .6 }];
TOWERS.forEach(T => { const [u, v] = toUV(CX + T.dx, CY + T.dy); T.d = v - vShore(u); T.x = CX + T.dx; T.y = CY + T.dy; });
const T_KEEP = .44, T_TOW = .52, T_WALL = .2, BK_H = .52;
// rebuild schedule: tower lifts (bucket comes off) and who does it
const LIFT = { N: 10.4, S: 11.2, E: 12.8, W: 13.8 };          // rot 1: N is screen right (sea side), S left, E front, W back
const KEEP_B = [9.1, 12.0], WALL_B = [14.6, 16.2], MOUND_B = [9.1, 15.2], DRY = 3.4;
const hitKeep = bigHit(CASTLE_D), hitWall = bigHit(CASTLE_D - .45);
function partState(t) {
  // f = height factor (1 built, 0 gone), w = wetness 0..1, cren = battlements still crisp
  const S = {};
  const washed = (t0, dur) => 1 - sstep((t - t0) / dur);
  // keep
  if (t < hitKeep) S.keep = { f: 1, w: 0 };
  else if (t < KEEP_B[0]) S.keep = { f: washed(hitKeep + .1, 1.1), w: 1 };
  else S.keep = { f: sstep((t - KEEP_B[0]) / (KEEP_B[1] - KEEP_B[0])), w: 1 - clamp((t - KEEP_B[1]) / DRY, 0, 1) };
  for (const T of TOWERS) {
    const hit = bigHit(T.d), L = LIFT[T.n];
    if (t < hit) S[T.n] = { f: 1, w: 0 };
    else if (t < L) S[T.n] = { f: washed(hit, .75), w: 1 };
    else S[T.n] = { f: 1, w: 1 - clamp((t - L) / DRY, 0, 1) };
  }
  if (t < hitWall) S.wall = { f: 1, w: 0 };
  else if (t < WALL_B[0]) S.wall = { f: washed(hitWall, .6), w: 1 };
  else S.wall = { f: sstep((t - WALL_B[0]) / (WALL_B[1] - WALL_B[0])), w: 1 - clamp((t - WALL_B[1]) / DRY, 0, 1) };
  // the lump: grows as the castle slumps, is patted back into the keep and the wall
  let m = 0;

  capsule(F.base, top, .025, .02, () => [240, 236, 220], 'solid');

  const [wx, wy] = fromUV(1, .25), wl = Math.hypot(wx, wy);
  for (let a = 0; a <= .3; a += .02) for (let b = 0; b <= .16 * (1 - a / .3); b += .02) {
    const fl = .04 * Math.sin(TAU * 10 * t / LOOP - a * 12), p = add3(top, ax.map(q => -q * (b + .02)));

// crabs: each pops out of its hole when its patch of sand is safe, scuttles sideways in stop-start bursts, and goes back in.

const CRABS = [{ u: -2.5, d: 1.9, t0: 9.6, len: 6.4, du: 1.5, dv: -.3, k: 1.65 },        // back, along the wet strip, after the big wave
  { u: 2.6, d: 2.0, t0: 15.4, len: 8.8, du: .9, dv: .25, k: 1.45 },                   // front, by the water: out across the loop seam
  { u: -1.2, d: 5.2, t0: 1.0, len: 11.0, du: .9, dv: .6, k: 1.35 },                     // dry sand up the beach (left), never reached
  { u: 2.3, d: 2.9, t0: 11.2, len: 6.0, du: .8, dv: .5, k: 1.5 }];                      // front-left, after the rebuild starts
function drawCrab(C, t) {

  for (const sd of [-1, 1]) {
    sphere(p[0] + sd * .12 * k, p[1] - sd * .12 * k, z + (.1 + (sd > 0 ? Math.max(0, Math.sin(a * 9)) * .05 : 0)) * k, .06 * k, [248, 104, 64], 'solid');   // claws, one waving
    for (const j of [-1, 0, 1]) capsule([p[0] + (sd * .06 + j * .05) * k, p[1] + (-sd * .06 + j * .05) * k, z + .07 * k], [p[0] + (sd * .17 + j * .07) * k + step * j, p[1] + (-sd * .17 + j * .07) * k, z], .02 * k, .015 * k, () => [200, 90, 56], 'solid');
  }
  for (const [ex, ey] of [[.02, .1], [.1, .02]]) { capsule([p[0] + ex * k, p[1] + ey * k, z + .13 * k], [p[0] + ex * k, p[1] + ey * k, z + .2 * k], .012 * k, .012 * k, () => [200, 90, 56], 'solid'); sphere(p[0] + ex * k, p[1] + ey * k, z + .21 * k, .03 * k, [24, 24, 28], 'solid'); }

}
// a paddler doing a lap of the sea out back (seaplane v3), gulls circling over the beach
const KY = (() => { const [x, y] = fromUV(.6, -4.0); return { cx: x, cy: y, rx: 1.2, ry: .45 }; })();
const kayakAt = t => { const a = TAU * t / AL; return { x: KY.cx + KY.rx * Math.cos(a), y: KY.cy + KY.ry * Math.sin(a), yaw: Math.atan2(KY.ry * Math.cos(a), -KY.rx * Math.sin(a)) }; };
function onWater(i) { return i >= 0 && i < W * H && kinds[i] === 2 && zb[i] === groundZ[i]; }
function wplot(x, y, col) { const p = project(x, y, 0), i = (p.sy | 0) * W + (p.sx | 0); if (onWater(i)) pix[i] = col; }
function sitJ(seat) {
  const sh = [-.05, 0, seat + .95], J = { pel: [0, 0, seat], neck: add3(sh, [0, 0, .08]), head: [sh[0], 0, sh[2] + .36] };
  for (const s of [-1, 1]) { const side = s < 0 ? 'L' : 'R', shS = [sh[0], s * .36, sh[2] - .03]; J['hip' + side] = [0, s * .15, seat]; J['knee' + side] = [.5, s * .17, seat + .02]; J['foot' + side] = [.62, s * .19, seat - .5]; J['sh' + side] = shS; J['ha' + side] = [.42, s * .1, seat + .4]; J['el' + side] = add3(lerp3(shS, J['ha' + side], .5), [0, s * .12, -.1]); }
  return J;
}
const PADDLER = { shirt: [226, 76, 60], legs: [60, 64, 80], skin: [210, 160, 120], hat: [244, 244, 236] };
function drawKayak(t) {
  const K = kayakAt(t), fx = Math.cos(K.yaw), fy = Math.sin(K.yaw), sx = -fy, sy = fx, bob = .015 * Math.sin(TAU * 9 * t / AL), ph = TAU * 9 * t / AL, side = Math.sin(ph);
  for (let age = .1; age < 2.2; age += .07) {
    const Q = kayakAt(mod(t - age, AL)), qx = Math.cos(Q.yaw), qy = Math.sin(Q.yaw), sp = .12 + age * .16;
    for (const s of [-1, 1]) if (hash(Math.floor(age * 14), s + 3) < 1 - age / 2.2) wplot(Q.x - qx * .5 - qy * s * sp, Q.y - qy * .5 + qx * s * sp, age < .6 ? FOAM : LIGHT);
  }
  capsule([K.x - fx * .62, K.y - fy * .62, .07 + bob], [K.x + fx * .62, K.y + fy * .62, .07 + bob], .1, .07, () => [244, 196, 44], 'solid');
  const B = toWorld(K.x, K.y, K.yaw, .4, .02 + bob, sitJ(.15)), c = lerp3(B.shL, B.shR, .5);
  const pa = [c[0] + sx * .45 + fx * .14, c[1] + sy * .45 + fy * .14, c[2] - .12 + side * .32], pb = [c[0] - sx * .45 + fx * .14, c[1] - sy * .45 + fy * .14, c[2] - .12 - side * .32];
  B.haR = lerp3(c, pa, .4); B.haL = lerp3(c, pb, .4);
  B.elR = add3(lerp3(B.shR, B.haR, .5), [0, 0, -.05]); B.elL = add3(lerp3(B.shL, B.haL, .5), [0, 0, -.05]);
  drawBodyAdult(B, PADDLER);
  capsule(pa, pb, .025, .025, () => [40, 40, 44], 'solid');
  for (const e of [pa, pb]) capsule(e, lerp3(e, c, .18), .06, .05, () => [250, 236, 90], 'solid');
  castShadow(K.x, K.y, .2, .35);
}
function drawBodyAdult(B, pal) {
  const k = B.k, A = (a, b, r0, r1, f) => dynamicAdd(a, b, r0 * k, r1 * k, f), fx = Math.cos(B.yaw), fy = Math.sin(B.yaw);
  for (const s of ['L', 'R']) { A(B['hip' + s], B['knee' + s], .17, .13, () => pal.legs); A(B['knee' + s], B['foot' + s], .13, .11, () => pal.legs); }
  A(B.pel, B.neck, .31, .33, () => pal.shirt); A(B.neck, B.head, .11, .12, () => pal.skin); A(B.head, B.head, .24, .24, () => pal.skin);
  const hc = add3(B.head, [0, 0, .14 * k]); A(hc, hc, .21, .21, () => pal.hat);
  for (const s of ['L', 'R']) { A(B['sh' + s], B['el' + s], .12, .1, () => pal.shirt); A(B['el' + s], B['ha' + s], .1, .09, () => pal.shirt); }
}
const GULLS = [0, 1].map(i => ({ i, r: 2.4 + i * .9, z: 6.8 + i * .8, ph: i * 2.6, n: i === 1 ? -1 : 1 }));
function drawGulls(t) {
  for (const g of GULLS) {
    const a = g.ph + g.n * TAU * 2 * t / AL, [ox, oy] = fromUV(-1, -1.5), x = ox + Math.cos(a) * g.r * .75, y = oy + Math.sin(a) * g.r * .5, z = g.z + .3 * Math.sin(2 * a);
    const fx = -Math.sin(a) * g.n, fy = Math.cos(a) * g.n, sx = -fy, sy = fx, flap = Math.sin(TAU * 24 * t / AL + g.ph) * .25;
    capsule([x - fx * .15, y - fy * .15, z], [x + fx * .15, y + fy * .15, z], .06, .05, () => WHITE, 'solid');
    for (const s of [-1, 1]) capsule([x, y, z], [x + sx * s * .45, y + sy * s * .45, z + flap], .04, .02, () => [214, 218, 224], 'solid');

}

/* ---------- bake + frame ---------- */
function bake() {
  zb.fill(-1e9);
  for (let iy = 0; iy < H; iy++) { const q = iy / H, c = rgb(lerp(86, 196, q), lerp(160, 226, q), lerp(222, 242, q)); for (let ix = 0; ix < W; ix++) pix[iy * W + ix] = c; }
  for (const [cx, cy, r] of [[44, 50, 16], [66, 44, 12], [172, 92, 18], [150, 86, 11], [120, 30, 10]]) for (let iy = cy - r; iy <= cy + r; iy++) for (let ix = cx - 2 * r; ix <= cx + 2 * r; ix++) {
    if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;
    const d = ((ix - cx) / (2 * r)) ** 2 + ((iy - cy) / r) ** 2 + (noise(ix * .15, iy * .2) - .5) * .5;
    if (d < .55 && iy > cy - r * .5) pix[iy * W + ix] = d < .3 && iy < cy ? rgb(250, 252, 255) : rgb(232, 240, 250);

  groundZ.set(zb);
  umbrella();

}
function renderAt(time) {

  drawSwash(t);
  drawKayak(t);
  for (const C of CRABS) drawCrab(C, t);
  const S = drawCastle(t);
  castleSpray(t);
  drawFlag(t, S);
  for (const id of ['A', 'B']) { const k = kidAt(id, t); drawBody(k.B, KIDS[id].pal); drawBucket(id, t); }
  for (const [u, v, h, l, sd] of PALMS) palm(u, v, h, l, sd, t);
  drawGulls(t);
  flushShadows();
  applyShadows(groundZ);
  shadeEdges();

bake();
window.renderAt = renderAt; window.LOOP = LOOP; window.FRAMEBUF = pix;
window.EVENTS = { waves: WAVES.map(w => ({ t: w.t, big: !!w.big })), hit: { keep: hitKeep, wall: hitWall, towers: TOWERS.map(T => [T.n, bigHit(T.d)]) }, lifts: LIFT, flag: 17.3, runA: [4.45, 5.45], runB: [4.1, 5.15] };
renderAt(+(new URLSearchParams(location.search).get('t') || 0));
